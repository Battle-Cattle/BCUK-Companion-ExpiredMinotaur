name: Release

# Publishes a downloadable Windows build to a GitHub Release, via BCUK-Companion-Core's shared
# companion-release.yml (which also publishes the .sha256 checksum the in-app updater verifies).
# Three ways to trigger it:
# - Bump the version in VERSION and merge to main: tags v<VERSION> and releases it.
# - Push a version tag, e.g. git tag v1.0.0 && git push origin v1.0.0
# - Run manually from the Actions tab with an already-pushed tag (e.g. to retry a failed run).

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    # Pinned to a commit, like the actions in dotnet.yml: a later push to Core's main must not
    # change what this repo's release runs. Bump it deliberately, as with the package versions.
    uses: Battle-Cattle/BCUK-Companion-Core/.github/workflows/companion-release.yml@ddbb2fb6fd0d88669f12170aecfc379e9252fd56 # Core 0.13.0 / Shell 0.12.0
    permissions:
      contents: write
    with:
      project: src/BCUKCompanion.ExpiredMinotaur/BCUKCompanion.ExpiredMinotaur.csproj
      app-name: BCUKCompanion.ExpiredMinotaur
      tag: ${{ inputs.tag }}
    secrets:
      packages-read-pat: ${{ secrets.PACKAGES_READ_PAT }}
