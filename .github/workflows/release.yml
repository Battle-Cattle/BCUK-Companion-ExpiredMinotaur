name: Release

# Publishes a downloadable Windows build to a GitHub Release.
# Trigger by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# or run manually from the Actions tab with an already-pushed tag (e.g. to retry a failed run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish (Windows x64)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PROJECT: src/BCUKCompanion.ExpiredMinotaur/BCUKCompanion.ExpiredMinotaur.csproj
      APP_NAME: BCUKCompanion.ExpiredMinotaur
    steps:
      # On a manual run, build the requested tag itself rather than whatever branch the run
      # was started from; checkout fails if the tag doesn't exist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Compute version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+([-+].*)?$') {
            throw "Tag '$env:TAG' must look like v1.2.3 (optionally with a -prerelease suffix)."
          }
          $version = $env:TAG.Substring(1)
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Self-contained so end users don't need the .NET runtime installed. Publish does its
      # own restore so the runtime packs match the self-contained setting.
      - name: Publish
        shell: pwsh
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_PAT }}
        run: >
          dotnet publish $env:PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          "-p:Version=$env:VERSION"

      - name: Package
        shell: pwsh
        run: |
          $zip = "$env:APP_NAME-$env:TAG-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ghArgs = @($env:TAG, $env:ZIP, '--repo', $env:GITHUB_REPOSITORY, '--title', $env:TAG, '--generate-notes', '--verify-tag')
          if ($env:VERSION -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
