name: .NET

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this before publishing, so a release only ships from a commit whose
  # tests pass.
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to build and test (defaults to the triggering ref)"
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_READ_PAT:
        description: "Classic PAT with read:packages, to restore BCUKCompanion.* from GitHub Packages"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Restores pull from both the private GitHub Packages feed and nuget.org, so reuse the
      # package folder between runs. The key covers every file that decides what gets restored.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_PAT }}
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release
