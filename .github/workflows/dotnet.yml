name: .NET

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this before publishing, so a release only ships from a commit whose
  # tests pass.
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to build and test (defaults to the triggering ref)"
        required: false
        type: string
        default: ""
    secrets:
      PACKAGES_READ_PAT:
        description: "Classic PAT with read:packages, to restore BCUKCompanion.* from GitHub Packages"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Reuse the nuget.org packages between runs. The key covers every file that decides what
      # gets restored. Pull requests (forks included) can read caches saved on main, so the
      # private GitHub Packages feed's BCUKCompanion.* packages are deleted before saving (below)
      # and always come from the feed, with PACKAGES_READ_PAT. "public" in the key keeps it from
      # matching a cache saved before that pruning existed.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-public-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props', 'NuGet.config') }}
          restore-keys: nuget-public-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_PAT }}
      - name: Build
        run: dotnet build --no-restore --configuration Release
      # coverage.runsettings writes lcov coverage under coverage/ for the Qlty upload.
      - name: Test
        run: dotnet test --no-build --configuration Release --settings coverage.runsettings --results-directory coverage
      # The coverage job below publishes this to Qlty.
      - name: Keep lcov coverage for the Qlty upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 1
      - name: Drop private packages from the NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-ChildItem "$HOME/.nuget/packages" -Directory -Filter 'bcukcompanion.*' | Remove-Item -Recurse -Force
      - name: Save NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  # Publishes coverage in a job of its own, so only this job can mint the OIDC token qlty-action
  # trades for a Qlty upload; the restore, build and test steps never see it. GitHub gives fork
  # and Dependabot pull requests no OIDC token, and qlty-action fails the job when it can't get
  # one, so those runs skip the upload.
  coverage:
    name: Publish coverage to Qlty
    needs: build
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qlty checks the report's source paths against the checkout, which lands at the same path
      # as in the build job (coverlet writes absolute paths).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/**/coverage.info
